services:
  postgres:
    image: postgres:16-alpine
    networks:
      - matify-internal
    container_name: matify_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: matify_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - matify-internal
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: matify_api
    networks:
      - matify-internal
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - REDIS_HOST=redis
    volumes:
      - ./services/api:/app
      - /app/node_modules
    depends_on:
      - postgres
      - minio
  redis:
    image: redis:7-alpine
    container_name: matify-redis
    restart: unless-stopped
    networks:
      - matify-internal
    volumes:
      - redis_data:/data
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: matify_worker
    environment:
      - REDIS_HOST=redis
      - S3_ENDPOINT=minio
      - S3_PORT=9000
    volumes:
      - ./services/worker:/app
      - /app/node_modules
    networks:
      - matify-internal
    depends_on:
      - redis
      - minio
  nginx:
    image: nginx:1.25-alpine
    container_name: matify_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - matify-internal
    depends_on:
      - api
      - minio
volumes:
  postgres_data:
  minio_data:
  redis_data:
networks:
  matify-internal:
    driver: bridge